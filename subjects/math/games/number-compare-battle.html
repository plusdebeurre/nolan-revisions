<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Compare Battle — Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .battle-card {
      flex: 1;
      min-width: 0;
      padding: 1.5rem 1rem;
      border-radius: 1.25rem;
      border: 4px solid #e2e8f0;
      background: white;
      font-size: clamp(2rem, 10vw, 3.25rem);
      font-weight: 700;
      color: var(--accent-dark);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }
    .battle-card:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--accent);
    }
    .battle-card.correct {
      border-color: #22c55e;
      background: #dcfce7;
    }
    .battle-card.wrong {
      border-color: #ef4444;
      background: #fee2e2;
    }
    .battle-card:disabled {
      cursor: default;
    }
    .vs-badge {
      font-size: 1.5rem;
      font-weight: 800;
      color: #94a3b8;
      align-self: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="game theme-math" data-game-id="math/number-compare-battle">
  <main class="w-full max-w-2xl mx-auto px-4 py-6">
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Math</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>

    <div id="play-screen">
      <header class="mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 drop-shadow-sm" style="color: var(--accent-dark)">Number Compare Battle</h1>
        <p class="text-lg text-slate-500 font-medium">Tap the number that wins the round!</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <p id="round-label" class="mt-2 text-sm font-semibold" style="color: var(--accent)">Round 1</p>
      </header>

      <div class="question-card p-6 md:p-8 animate-pop">
        <h2 id="prompt-text" class="text-2xl md:text-3xl font-semibold text-center mb-8 text-slate-700"></h2>
        <div class="flex gap-3 md:gap-4 items-stretch mb-6">
          <button type="button" id="left-card" class="battle-card"></button>
          <span class="vs-badge">VS</span>
          <button type="button" id="right-card" class="battle-card"></button>
        </div>
        <div id="feedback" class="hidden text-center p-4 rounded-xl text-lg font-medium mb-4"></div>
        <div class="text-center">
          <button type="button" id="next-btn" class="hidden btn-primary">Next Round 🚀</button>
        </div>
      </div>
    </div>

    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">⚔️</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Battle Over!</h2>
      <p class="text-2xl font-medium text-slate-600 mb-6">
        You scored <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="total-rounds">24</span>!
      </p>
      <p id="result-message" class="text-lg text-slate-500 mb-8 font-medium"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>

  <script>
    (function () {
      const ROUNDS = [
        { left: 342, right: 423, mode: 'bigger' },
        { left: 567, right: 576, mode: 'smaller' },
        { left: 289, right: 298, mode: 'bigger' },
        { left: 701, right: 710, mode: 'smaller' },
        { left: 450, right: 405, mode: 'bigger' },
        { left: 633, right: 363, mode: 'bigger' },
        { left: 812, right: 821, mode: 'smaller' },
        { left: 199, right: 201, mode: 'smaller' },
        { left: 540, right: 504, mode: 'bigger' },
        { left: 678, right: 687, mode: 'smaller' },
        { left: 256, right: 265, mode: 'smaller' },
        { left: 390, right: 309, mode: 'bigger' },
        { left: 478, right: 487, mode: 'bigger' },
        { left: 615, right: 651, mode: 'smaller' },
        { left: 728, right: 782, mode: 'smaller' },
        { left: 834, right: 843, mode: 'bigger' },
        { left: 105, right: 150, mode: 'smaller' },
        { left: 273, right: 237, mode: 'bigger' },
        { left: 506, right: 560, mode: 'smaller' },
        { left: 691, right: 619, mode: 'bigger' },
        { left: 880, right: 808, mode: 'bigger' },
        { left: 314, right: 341, mode: 'smaller' },
        { left: 429, right: 492, mode: 'bigger' },
        { left: 755, right: 575, mode: 'bigger' }
      ];

      const totalRoundsEl = document.getElementById('total-rounds');
      if (totalRoundsEl) totalRoundsEl.textContent = String(ROUNDS.length);

      let roundIndex = 0;
      let score = 0;
      let canAnswer = true;

      const promptText = document.getElementById('prompt-text');
      const leftCard = document.getElementById('left-card');
      const rightCard = document.getElementById('right-card');
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('next-btn');
      const progressBar = document.getElementById('progress-bar');
      const roundLabel = document.getElementById('round-label');
      const playScreen = document.getElementById('play-screen');
      const resultScreen = document.getElementById('result-screen');
      const scoreDisplay = document.getElementById('score-display');
      const resultMessage = document.getElementById('result-message');
      const restartBtn = document.getElementById('restart-btn');

      function winnerSide(round) {
        if (round.mode === 'bigger') {
          return round.left > round.right ? 'left' : 'right';
        }
        return round.left < round.right ? 'left' : 'right';
      }

      function loadRound() {
        canAnswer = true;
        feedback.classList.add('hidden');
        nextBtn.classList.add('hidden');
        leftCard.classList.remove('correct', 'wrong');
        rightCard.classList.remove('correct', 'wrong');
        leftCard.disabled = false;
        rightCard.disabled = false;

        const r = ROUNDS[roundIndex];
        roundLabel.textContent = `Round ${roundIndex + 1} of ${ROUNDS.length}`;
        progressBar.style.width = `${(roundIndex / ROUNDS.length) * 100}%`;

        promptText.textContent = r.mode === 'bigger' ? 'Which number is BIGGER?' : 'Which number is SMALLER?';
        leftCard.textContent = String(r.left);
        rightCard.textContent = String(r.right);
      }

      function choose(side) {
        if (!canAnswer) return;
        canAnswer = false;
        const r = ROUNDS[roundIndex];
        const win = winnerSide(r);
        const correct = side === win;

        leftCard.disabled = true;
        rightCard.disabled = true;

        if (win === 'left') leftCard.classList.add('correct');
        else rightCard.classList.add('correct');
        if (!correct) {
          if (side === 'left') leftCard.classList.add('wrong');
          else rightCard.classList.add('wrong');
        }

        feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
        const bigger = r.left > r.right ? r.left : r.right;
        const smaller = r.left < r.right ? r.left : r.right;
        if (correct) {
          score++;
          feedback.classList.add('bg-green-100', 'text-green-800');
          feedback.innerHTML = `<strong>You win this round! 🎉</strong><br>${bigger} is bigger than ${smaller}.`;
        } else {
          feedback.classList.add('bg-red-100', 'text-red-800');
          const wanted = r.mode === 'bigger' ? bigger : smaller;
          feedback.innerHTML = `<strong>Compare hundreds, then tens, then ones!</strong><br>The ${r.mode === 'bigger' ? 'bigger' : 'smaller'} number is ${wanted}.`;
        }
        nextBtn.classList.remove('hidden');
      }

      function showResults() {
        playScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        progressBar.style.width = '100%';
        scoreDisplay.textContent = score;
        if (score === ROUNDS.length) resultMessage.textContent = 'Champion comparer! Perfect battle! 🌟';
        else if (score >= Math.ceil(ROUNDS.length * 0.75)) resultMessage.textContent = 'Strong comparing skills! 👍';
        else resultMessage.textContent = 'Start from the hundreds place and work left to right! 💪';
      }

      leftCard.addEventListener('click', () => choose('left'));
      rightCard.addEventListener('click', () => choose('right'));

      nextBtn.addEventListener('click', () => {
        roundIndex++;
        if (roundIndex < ROUNDS.length) loadRound();
        else showResults();
      });

      restartBtn.addEventListener('click', () => {
        roundIndex = 0;
        score = 0;
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        loadRound();
      });

      loadRound();
    })();
  </script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
</body>
</html>
