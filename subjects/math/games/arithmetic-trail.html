<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arithmetic Trail — Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .skill-badge {
      display: inline-block;
      background: white;
      border: 2px solid var(--card-border);
      color: var(--accent-dark);
      font-weight: 700;
      border-radius: 999px;
      padding: 0.2rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.95rem;
    }
    .story-line {
      font-size: 1.25rem;
      line-height: 1.45;
      font-weight: 600;
      color: #334155;
      margin: 0 auto 1rem;
      max-width: 28rem;
    }
    .equation {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem 0.5rem;
      font-size: clamp(1.8rem, 7vw, 3rem);
      font-weight: 800;
      color: var(--accent-dark);
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }
    .answer-box {
      min-width: 3.4rem;
      min-height: 3.3rem;
      padding: 0 0.7rem;
      border-radius: 0.8rem;
      border: 3px solid var(--accent);
      background: #fffbeb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95em;
    }
    .answer-box.empty { color: #cbd5e1; }
    .answer-box.ok { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .answer-box.bad { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      max-width: 22rem;
      margin: 0 auto;
      user-select: none;
    }
    .keypad .key {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      padding: 0.75rem 0;
      min-height: 3.4rem;
      touch-action: manipulation;
    }
    .keypad .key-word { font-size: 1.05rem; }
    .keypad.is-locked { opacity: 0.55; }
    .trail {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 0.65rem;
    }
    .trail i {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 99px;
      background: #e2e8f0;
      display: block;
    }
    .trail i.on { background: var(--accent); }
    .trail i.now { background: var(--accent-dark); transform: scale(1.35); }
    #check-btn, #next-btn { min-width: 12rem; }
    @media (max-width: 700px) {
      .score-hud { display: none; }
      .game-main { padding-top: 0.75rem; padding-bottom: 1rem; }
      .trail-head { margin-bottom: 0.75rem; }
      .trail-head h1 { font-size: 1.7rem; margin-bottom: 0.15rem; }
      .trail-head .subtitle { font-size: 0.95rem; line-height: 1.3; }
      #game-card { padding: 0.9rem 0.85rem 1rem; }
      .skill-badge { margin-bottom: 0.4rem; }
      .story-line { font-size: 1.08rem; margin-bottom: 0.55rem; }
      .equation { margin-bottom: 0.7rem; font-size: clamp(1.55rem, 8vw, 2.3rem); }
      .keypad { gap: 0.4rem; max-width: 17.5rem; }
      .keypad .key { min-height: 2.9rem; padding: 0.45rem 0; font-size: 1.4rem; }
      .answer-box { min-width: 2.8rem; min-height: 2.7rem; }
    }
  </style>
</head>
<body class="game theme-math" data-game-id="math/arithmetic-trail">
  <main class="game-main w-full max-w-2xl mx-auto px-4 py-6">
    <div class="score-hud" id="live-score-hud">Score: 0 / 24</div>
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Math</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>

    <div id="play-screen">
      <header class="trail-head mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 drop-shadow-sm" style="color: var(--accent-dark)">Arithmetic Trail</h1>
        <p class="subtitle text-lg text-slate-500 font-medium">End of semester 1 · type the answer</p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar-fill"></div></div>
        <div id="trail" class="trail" aria-hidden="true"></div>
        <p id="round-label" class="mt-2 text-sm font-semibold" style="color: var(--accent)">Stop 1 of 24</p>
      </header>

      <div id="game-card" class="question-card p-6 md:p-8 animate-pop text-center">
        <p id="skill-badge" class="skill-badge">Addition</p>
        <p id="story-line" class="story-line hidden"></p>
        <div class="equation" aria-live="polite">
          <span id="eq-before"></span>
          <span id="answer-box" class="answer-box empty">?</span>
          <span id="eq-after"></span>
        </div>
        <div id="keypad" class="keypad mb-4"></div>
        <button type="button" id="check-btn" class="btn-primary">Check</button>
        <div id="hint-area" class="mb-2">
          <button type="button" id="hint-btn" class="btn-hint mx-auto"><span>🦉 Get a hint from Mr. Owl</span></button>
          <div id="hint-display" class="hidden mt-4 p-4 bg-purple-50 border-2 border-purple-200 rounded-xl text-purple-800 text-sm md:text-base font-medium text-left"></div>
        </div>
        <div id="feedback" class="hidden text-center p-4 rounded-xl text-lg font-medium mb-4"></div>
        <div class="text-center">
          <button type="button" id="next-btn" class="hidden btn-primary">Next stop 🚀</button>
        </div>
      </div>
    </div>

    <div id="finish-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">🧮</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Trail complete!</h2>
      <p class="text-2xl font-medium text-slate-600 mb-6">You scored <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="total-rounds">24</span>!</p>
      <p id="result-message" class="text-lg text-slate-500 mb-8 font-medium"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>
  <script src="../../../js/fun-effects.js"></script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
  <script>
    (function () {
      /* generator-start */
      var MINUS = '−';

      function randInt(rng, min, max) {
        return min + Math.floor(rng() * (max - min + 1));
      }

      function mulberry32(seed) {
        var a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function shuffle(arr, rng) {
        var x = arr.slice();
        for (var n = x.length - 1; n > 0; n--) {
          var j = Math.floor(rng() * (n + 1));
          var tmp = x[n];
          x[n] = x[j];
          x[j] = tmp;
        }
        return x;
      }

      var THINGS = ['stickers', 'marbles', 'apples', 'crayons', 'shells', 'stars', 'cards', 'blocks'];

      var PLAN = [
        { kind: 'add20' },
        { kind: 'add20' },
        { kind: 'add20', story: true, double: true },
        { kind: 'sub20' },
        { kind: 'sub20' },
        { kind: 'sub20', story: true },
        { kind: 'add21' },
        { kind: 'add21', story: true, regroup: true },
        { kind: 'add2' },
        { kind: 'add2', story: true, regroup: true },
        { kind: 'sub21' },
        { kind: 'sub21', story: true, borrow: true },
        { kind: 'sub2' },
        { kind: 'sub2', story: true, borrow: true },
        { kind: 'plus10' },
        { kind: 'minus10' },
        { kind: 'plus100' },
        { kind: 'plus10cross' },
        { kind: 'addend' },
        { kind: 'take' },
        { kind: 'tens' },
        { kind: 'times', table: 2 },
        { kind: 'times', table: 5 },
        { kind: 'times', table: 10 }
      ];

      function thing(rng) {
        return THINGS[randInt(rng, 0, THINGS.length - 1)];
      }

      function be(n) {
        return n === 1 ? 'is' : 'are';
      }

      function storyAdd(rng, a, b) {
        var item = thing(rng);
        return '{{name}}, there are ' + a + ' ' + item + '. ' + b + ' more ' + be(b) + ' added. How many ' + item + ' now?';
      }

      function storySub(rng, a, b) {
        var item = thing(rng);
        return '{{name}}, there are ' + a + ' ' + item + '. ' + b + ' ' + be(b) + ' given away. How many ' + item + ' are left?';
      }

      function whyAdd(a, b) {
        var ao = a % 10;
        var bo = b % 10;
        var at = Math.floor(a / 10);
        var bt = Math.floor(b / 10);
        var ones = ao + bo;
        if (a < 10 && b < 10) {
          if (a === b) return 'Double ' + a + ' is ' + (a + b) + '.';
          var big = Math.max(a, b);
          var small = a + b - big;
          var need = 10 - big;
          var rest = small - need;
          return 'Make a ten: ' + big + ' + ' + need + ' = 10, then ' + rest + ' more. ' + a + ' + ' + b + ' = ' + (a + b) + '.';
        }
        if (ones < 10) {
          return 'Add the ones: ' + ao + ' + ' + bo + ' = ' + ones + '. Add the tens: ' + at + ' + ' + bt + ' = ' + (at + bt) + '. The answer is ' + (a + b) + '.';
        }
        var write = ones - 10;
        var tens = at + bt + 1;
        if (bt === 0) {
          return 'Add the ones: ' + ao + ' + ' + bo + ' = ' + ones + '. Write ' + write + ' and carry 1. The tens digit ' + at + ' plus that 1 makes ' + tens + '. The answer is ' + (a + b) + '.';
        }
        return 'Add the ones: ' + ao + ' + ' + bo + ' = ' + ones + '. Write ' + write + ' and carry 1. Tens: ' + at + ' + ' + bt + ' + 1 = ' + tens + '. The answer is ' + (a + b) + '.';
      }

      function whySub(a, b) {
        var ao = a % 10;
        var bo = b % 10;
        var at = Math.floor(a / 10);
        var bt = Math.floor(b / 10);
        if (a < 20 && b < 20) {
          return a + ' ' + MINUS + ' ' + b + ' = ' + (a - b) + '. You can count up from ' + b + ' to ' + a + '.';
        }
        if (ao >= bo) {
          if (bt === 0) {
            return 'Ones: ' + ao + ' ' + MINUS + ' ' + bo + ' = ' + (ao - bo) + '. The tens digit stays ' + at + '. The answer is ' + (a - b) + '.';
          }
          return 'Ones: ' + ao + ' ' + MINUS + ' ' + bo + ' = ' + (ao - bo) + '. Tens: ' + at + ' ' + MINUS + ' ' + bt + ' = ' + (at - bt) + '. The answer is ' + (a - b) + '.';
        }
        var ones = ao + 10 - bo;
        var tens = at - 1 - bt;
        if (bt === 0) {
          return 'You cannot take ' + bo + ' from ' + ao + ', so borrow 1 ten. Ones: ' + (ao + 10) + ' ' + MINUS + ' ' + bo + ' = ' + ones + '. The tens digit is now ' + (at - 1) + '. The answer is ' + (a - b) + '.';
        }
        return 'You cannot take ' + bo + ' from ' + ao + ', so borrow 1 ten. Ones: ' + (ao + 10) + ' ' + MINUS + ' ' + bo + ' = ' + ones + '. Tens: ' + (at - 1) + ' ' + MINUS + ' ' + bt + ' = ' + tens + '. The answer is ' + (a - b) + '.';
      }

      function countBy(table, times) {
        var bits = [];
        for (var i = 1; i <= times; i++) bits.push(String(table * i));
        return bits.join(', ');
      }

      function make(spec, rng) {
        var kind = spec.kind;
        var round = { kind: kind, line: '' };

        if (kind === 'add20') {
          var a;
          var b;
          if (spec.double) {
            a = randInt(rng, 6, 9);
            b = a;
          } else {
            a = randInt(rng, 5, 9);
            b = randInt(rng, Math.max(2, 11 - a), Math.min(9, 18 - a));
          }
          round.op = 'add';
          round.a = a;
          round.b = b;
          round.answer = a + b;
          round.badge = 'Add within 20';
          round.before = a + ' + ' + b + ' = ';
          round.after = '';
          round.hint = a === b ? 'A double is the same number added twice.' : 'Make a ten first, then add what is left.';
          round.why = whyAdd(a, b);
          if (spec.story) round.line = storyAdd(rng, a, b);
        } else if (kind === 'sub20') {
          var sa = randInt(rng, 12, 18);
          var so = sa % 10;
          var sb = randInt(rng, so + 1, sa - 2);
          round.op = 'sub';
          round.a = sa;
          round.b = sb;
          round.answer = sa - sb;
          round.badge = 'Subtract within 20';
          round.before = sa + ' ' + MINUS + ' ' + sb + ' = ';
          round.after = '';
          round.hint = 'Count back, or ask what to add to the smaller number.';
          round.why = whySub(sa, sb);
          if (spec.story) round.line = storySub(rng, sa, sb);
        } else if (kind === 'add21') {
          var tens;
          var ones;
          var add;
          if (spec.regroup) {
            tens = randInt(rng, 1, 8);
            ones = randInt(rng, 2, 9);
            add = randInt(rng, 10 - ones, 9);
          } else {
            tens = randInt(rng, 2, 8);
            ones = randInt(rng, 0, 7);
            add = randInt(rng, 1, 9 - ones);
          }
          var base = tens * 10 + ones;
          round.op = 'add';
          round.a = base;
          round.b = add;
          round.answer = base + add;
          round.badge = 'Add a 1-digit number';
          round.before = base + ' + ' + add + ' = ';
          round.after = '';
          round.hint = spec.regroup
            ? 'Add the ones. If they make 10 or more, carry 1 ten.'
            : 'Add the ones. The tens digit stays the same.';
          round.why = whyAdd(base, add);
          if (spec.story) round.line = storyAdd(rng, base, add);
        } else if (kind === 'add2') {
          var at;
          var bt;
          var ao;
          var bo;
          if (spec.regroup) {
            at = randInt(rng, 1, 4);
            bt = randInt(rng, 1, 8 - at);
            ao = randInt(rng, 1, 9);
            bo = randInt(rng, 10 - ao, 9);
          } else {
            at = randInt(rng, 1, 4);
            bt = randInt(rng, 1, 8 - at);
            ao = randInt(rng, 0, 4);
            bo = randInt(rng, 0, 9 - ao);
          }
          var left = at * 10 + ao;
          var right = bt * 10 + bo;
          round.op = 'add';
          round.a = left;
          round.b = right;
          round.answer = left + right;
          round.badge = 'Add two 2-digit numbers';
          round.before = left + ' + ' + right + ' = ';
          round.after = '';
          round.hint = spec.regroup
            ? 'Add the ones first. If they make 10 or more, carry 1 ten.'
            : 'Add the ones, then the tens. Nothing to carry.';
          round.why = whyAdd(left, right);
          if (spec.story) round.line = storyAdd(rng, left, right);
        } else if (kind === 'sub21') {
          var st;
          var so2;
          var sub;
          if (spec.borrow) {
            st = randInt(rng, 2, 9);
            so2 = randInt(rng, 0, 8);
            sub = randInt(rng, so2 + 1, 9);
          } else {
            st = randInt(rng, 2, 9);
            so2 = randInt(rng, 2, 9);
            sub = randInt(rng, 1, so2 - 1);
          }
          var from = st * 10 + so2;
          round.op = 'sub';
          round.a = from;
          round.b = sub;
          round.answer = from - sub;
          round.badge = 'Subtract a 1-digit number';
          round.before = from + ' ' + MINUS + ' ' + sub + ' = ';
          round.after = '';
          round.hint = spec.borrow
            ? 'The ones are too small. Borrow 1 ten, then subtract.'
            : 'Subtract the ones. The tens digit stays the same.';
          round.why = whySub(from, sub);
          if (spec.story) round.line = storySub(rng, from, sub);
        } else if (kind === 'sub2') {
          var fat;
          var fbt;
          var fao;
          var fbo;
          if (spec.borrow) {
            fat = randInt(rng, 3, 9);
            fbt = randInt(rng, 1, fat - 2);
            fao = randInt(rng, 0, 8);
            fbo = randInt(rng, fao + 1, 9);
          } else {
            fat = randInt(rng, 3, 9);
            fbt = randInt(rng, 1, fat - 1);
            fao = randInt(rng, 1, 9);
            fbo = randInt(rng, 0, fao);
          }
          var top = fat * 10 + fao;
          var bottom = fbt * 10 + fbo;
          round.op = 'sub';
          round.a = top;
          round.b = bottom;
          round.answer = top - bottom;
          round.badge = 'Subtract two 2-digit numbers';
          round.before = top + ' ' + MINUS + ' ' + bottom + ' = ';
          round.after = '';
          round.hint = spec.borrow
            ? 'If the top ones digit is smaller, borrow 1 ten.'
            : 'Subtract the ones, then the tens. No need to borrow.';
          round.why = whySub(top, bottom);
          if (spec.story) round.line = storySub(rng, top, bottom);
        } else if (kind === 'plus10') {
          var p = randInt(rng, 2, 7) * 10 + randInt(rng, 0, 9);
          round.op = 'add';
          round.a = p;
          round.b = 10;
          round.answer = p + 10;
          round.badge = 'Mental +10';
          round.before = p + ' + 10 = ';
          round.after = '';
          round.hint = 'Adding 10 bumps the tens digit by 1. The ones stay the same.';
          round.why = p + ' + 10 = ' + (p + 10) + '. The ones digit stays ' + (p % 10) + '. The tens digit goes from ' + Math.floor(p / 10) + ' to ' + (Math.floor(p / 10) + 1) + '.';
        } else if (kind === 'minus10') {
          var m = randInt(rng, 3, 9) * 10 + randInt(rng, 0, 9);
          round.op = 'sub';
          round.a = m;
          round.b = 10;
          round.answer = m - 10;
          round.badge = 'Mental −10';
          round.before = m + ' ' + MINUS + ' 10 = ';
          round.after = '';
          round.hint = 'Taking away 10 lowers the tens digit by 1. The ones stay the same.';
          round.why = m + ' ' + MINUS + ' 10 = ' + (m - 10) + '. The ones digit stays ' + (m % 10) + '. The tens digit goes from ' + Math.floor(m / 10) + ' to ' + (Math.floor(m / 10) - 1) + '.';
        } else if (kind === 'plus100') {
          var h = randInt(rng, 1, 7);
          var t = randInt(rng, 0, 9);
          var o = randInt(rng, 0, 9);
          var n = h * 100 + t * 10 + o;
          round.op = 'add';
          round.a = n;
          round.b = 100;
          round.answer = n + 100;
          round.badge = 'Mental +100';
          round.before = n + ' + 100 = ';
          round.after = '';
          round.hint = 'Adding 100 bumps the hundreds digit by 1. Tens and ones stay the same.';
          round.why = n + ' + 100 = ' + (n + 100) + '. Hundreds go from ' + h + ' to ' + (h + 1) + '. The tens and ones stay the same.';
        } else if (kind === 'plus10cross') {
          var ch = randInt(rng, 1, 6);
          var co = randInt(rng, 0, 9);
          var cn = ch * 100 + 90 + co;
          round.op = 'add';
          round.a = cn;
          round.b = 10;
          round.answer = cn + 10;
          round.badge = 'Mental +10 across 100';
          round.before = cn + ' + 10 = ';
          round.after = '';
          round.hint = 'The tens digit is 9, so +10 jumps to the next hundred.';
          round.why = cn + ' + 10 = ' + (cn + 10) + '. Ones stay ' + co + '. The 9 tens become 0, and hundreds go from ' + ch + ' to ' + (ch + 1) + '.';
        } else if (kind === 'addend') {
          var sum = randInt(rng, 11, 18);
          var known = randInt(rng, 2, sum - 2);
          round.op = 'addend';
          round.a = sum - known;
          round.b = known;
          round.sum = sum;
          round.answer = sum - known;
          round.badge = 'Missing number';
          round.before = '';
          round.after = ' + ' + known + ' = ' + sum;
          round.hint = 'The box is the other part that makes the total.';
          round.why = round.answer + ' + ' + known + ' = ' + sum + '.';
        } else if (kind === 'take') {
          var whole = randInt(rng, 12, 18);
          var hidden = randInt(rng, 2, whole - 2);
          var rest = whole - hidden;
          round.op = 'take';
          round.a = whole;
          round.b = hidden;
          round.rest = rest;
          round.answer = hidden;
          round.badge = 'Missing number';
          round.before = whole + ' ' + MINUS + ' ';
          round.after = ' = ' + rest;
          round.hint = 'The box is how many you take away.';
          round.why = whole + ' ' + MINUS + ' ' + hidden + ' = ' + rest + '.';
        } else if (kind === 'tens') {
          var part = randInt(rng, 2, 6) * 10;
          var other = randInt(rng, 2, Math.floor((100 - part) / 10)) * 10;
          round.op = 'addend';
          round.a = part;
          round.b = other;
          round.sum = part + other;
          round.answer = part;
          round.badge = 'Missing tens';
          round.before = '';
          round.after = ' + ' + other + ' = ' + (part + other);
          round.hint = 'Count by tens up to the total.';
          round.why = part + ' + ' + other + ' = ' + (part + other) + '.';
        } else if (kind === 'times') {
          var times = randInt(rng, 2, 10);
          var table = spec.table;
          round.op = 'mul';
          round.a = times;
          round.b = table;
          round.answer = times * table;
          round.badge = 'Times ×' + table;
          round.before = times + ' × ' + table + ' = ';
          round.after = '';
          round.line = times + ' groups of ' + table;
          round.hint = 'Count by ' + table + 's, ' + times + ' times.';
          round.why = times + ' groups of ' + table + ': ' + countBy(table, times) + '. The answer is ' + (times * table) + '.';
        }

        round.answer = Number(round.answer);
        round.key = kind + '|' + round.before + '|' + round.after + '|' + round.answer;
        if (solved(round) !== round.answer) {
          throw new Error('Bad arithmetic round: ' + round.key);
        }
        return round;
      }

      function solved(r) {
        if (r.op === 'add') return r.a + r.b;
        if (r.op === 'sub') return r.a - r.b;
        if (r.op === 'mul') return r.a * r.b;
        if (r.op === 'addend') return r.sum - r.b;
        if (r.op === 'take') return r.a - r.rest;
        return NaN;
      }

      function uniqueRounds(seed) {
        var rng = mulberry32(seed >>> 0);
        var plan = shuffle(PLAN, rng);
        var seen = {};
        return plan.map(function (spec) {
          var round = make(spec, rng);
          var guard = 0;
          while (seen[round.key] && guard < 12) {
            round = make(spec, rng);
            guard++;
          }
          seen[round.key] = true;
          return round;
        });
      }

      function newSeed() {
        return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
      }
      /* generator-end */

      var TOTAL = PLAN.length;
      var rounds = [];
      var roundIndex = 0;
      var score = 0;
      var streak = 0;
      var typed = '';
      var canAnswer = true;

      var playScreen = document.getElementById('play-screen');
      var finishScreen = document.getElementById('finish-screen');
      var badgeEl = document.getElementById('skill-badge');
      var storyEl = document.getElementById('story-line');
      var beforeEl = document.getElementById('eq-before');
      var afterEl = document.getElementById('eq-after');
      var answerBox = document.getElementById('answer-box');
      var keypad = document.getElementById('keypad');
      var checkBtn = document.getElementById('check-btn');
      var hintBtn = document.getElementById('hint-btn');
      var hintDisplay = document.getElementById('hint-display');
      var feedback = document.getElementById('feedback');
      var nextBtn = document.getElementById('next-btn');
      var progressBar = document.getElementById('progress-bar');
      var roundLabel = document.getElementById('round-label');
      var trail = document.getElementById('trail');
      var scoreDisplay = document.getElementById('score-display');
      var totalRoundsEl = document.getElementById('total-rounds');
      var resultMessage = document.getElementById('result-message');
      var restartBtn = document.getElementById('restart-btn');
      var hud = document.getElementById('live-score-hud');
      var gameCard = document.getElementById('game-card');

      totalRoundsEl.textContent = String(TOTAL);
      document.body.dataset.totalRounds = String(TOTAL);

      function gid() {
        if (window.NolanProgress && NolanProgress.inferGameIdFromPath) {
          return NolanProgress.inferGameIdFromPath() || document.body.getAttribute('data-game-id');
        }
        return document.body.getAttribute('data-game-id');
      }

      function fill(text) {
        if (window.NolanProgress && NolanProgress.fillName) return NolanProgress.fillName(text);
        return String(text || '').replace(/\{\{name\}\}/gi, 'You');
      }

      function fun() {
        return window.FunEffects || null;
      }

      function roundOk(r) {
        return !!(r && Number.isInteger(r.answer) && r.answer >= 0 && r.answer <= 999 &&
          typeof r.before === 'string' && typeof r.after === 'string' &&
          typeof r.why === 'string' && typeof r.hint === 'string' &&
          typeof r.badge === 'string' && typeof r.key === 'string' &&
          solved(r) === r.answer);
      }

      function saveCp(nextIndex) {
        if (!window.NolanProgress || !NolanProgress.saveCheckpoint) return;
        var id = gid();
        if (!id) return;
        NolanProgress.saveCheckpoint(id, {
          index: nextIndex,
          score: score,
          extra: { rounds: rounds, streak: streak }
        });
      }

      function clearCp() {
        if (!window.NolanProgress || !NolanProgress.clearCheckpoint) return;
        var id = gid();
        if (id) NolanProgress.clearCheckpoint(id);
      }

      function paintScore(pulse) {
        hud.textContent = 'Score: ' + score + ' / ' + TOTAL;
        if (roundIndex < TOTAL) {
          roundLabel.textContent = 'Stop ' + (roundIndex + 1) + ' of ' + TOTAL + ' · Score ' + score;
        }
        if (pulse && fun() && fun().pulseScore) fun().pulseScore(hud);
      }

      function paintTrail() {
        trail.innerHTML = '';
        for (var i = 0; i < TOTAL; i++) {
          var dot = document.createElement('i');
          if (i < roundIndex) dot.className = 'on';
          else if (i === roundIndex) dot.className = 'now';
          trail.appendChild(dot);
        }
      }

      function paintAnswer(state) {
        answerBox.textContent = typed === '' ? '?' : typed;
        answerBox.className = 'answer-box' + (typed === '' ? ' empty' : '') + (state ? ' ' + state : '');
      }

      function lockPad(locked) {
        keypad.classList.toggle('is-locked', locked);
        var keys = keypad.querySelectorAll('button');
        for (var i = 0; i < keys.length; i++) keys[i].disabled = locked;
        checkBtn.classList.toggle('hidden', locked);
      }

      function loadRound() {
        canAnswer = true;
        typed = '';
        var round = rounds[roundIndex];
        badgeEl.textContent = round.badge;
        if (round.line) {
          storyEl.textContent = fill(round.line);
          storyEl.classList.remove('hidden');
        } else {
          storyEl.textContent = '';
          storyEl.classList.add('hidden');
        }
        beforeEl.textContent = round.before;
        afterEl.textContent = round.after;
        paintAnswer('');
        lockPad(false);
        hintDisplay.classList.add('hidden');
        hintDisplay.textContent = '';
        hintBtn.classList.remove('hidden');
        feedback.classList.add('hidden');
        feedback.innerHTML = '';
        nextBtn.classList.add('hidden');
        roundLabel.textContent = 'Stop ' + (roundIndex + 1) + ' of ' + TOTAL + ' · Score ' + score;
        progressBar.style.width = ((roundIndex / TOTAL) * 100) + '%';
        paintTrail();
        paintScore(false);
      }

      function typeDigit(d) {
        if (!canAnswer || typed.length >= 3) return;
        typed += d;
        paintAnswer('');
      }

      function erase() {
        if (!canAnswer || !typed) return;
        typed = typed.slice(0, -1);
        paintAnswer('');
      }

      function submit() {
        if (!canAnswer) return;
        if (typed === '') {
          if (fun()) fun().shake(answerBox);
          return;
        }
        canAnswer = false;
        lockPad(true);
        hintBtn.classList.add('hidden');
        var round = rounds[roundIndex];
        var value = Number(typed);
        var correct = value === round.answer;
        feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
        if (correct) {
          score++;
          streak++;
          paintAnswer('ok');
          paintScore(true);
          if (fun()) fun().showStreak(streak);
          if (window.NolanProgress && NolanProgress.awardAnswerXp && NolanProgress.questionKey) {
            var awarded = NolanProgress.awardAnswerXp(gid(), {
              key: NolanProgress.questionKey([round.key]),
              correct: true,
              streak: streak
            });
            if (fun() && fun().showXpGain) {
              fun().showXpGain(awarded.xpGained, {
                alreadyAwarded: !!awarded.alreadyAwarded,
                bonus: awarded.bonus,
                anchor: window.matchMedia('(max-width: 700px)').matches ? roundLabel : hud
              });
            }
          }
          feedback.classList.add('bg-green-100', 'text-green-800');
          feedback.innerHTML = '<strong>Yes! 🎉</strong><br>' + round.why;
        } else {
          streak = 0;
          paintAnswer('bad');
          if (fun()) fun().shake(gameCard);
          feedback.classList.add('bg-red-100', 'text-red-800');
          feedback.innerHTML = '<strong>Not yet.</strong> The answer is ' + round.answer + '.<br>' + round.why;
        }
        saveCp(roundIndex + 1);
        nextBtn.textContent = roundIndex + 1 >= TOTAL ? 'See my score 🏆' : 'Next stop 🚀';
        nextBtn.classList.remove('hidden');
      }

      function showResults() {
        clearCp();
        playScreen.classList.add('hidden');
        scoreDisplay.textContent = String(score);
        progressBar.style.width = '100%';
        paintScore(false);
        if (score === TOTAL) {
          resultMessage.textContent = 'Perfect trail! Adding, subtracting, and ×2, ×5, ×10 are in great shape! 🌟';
          if (fun() && fun().celebratePerfect) fun().celebratePerfect();
        } else if (score >= Math.ceil(TOTAL * 0.75)) {
          resultMessage.textContent = 'Great work! Keep the tens, the borrowing, and the skip counting sharp. 👍';
        } else {
          resultMessage.textContent = 'Good try! Practice making tens, borrowing, and counting by 2s, 5s, and 10s. 💪';
        }
        finishScreen.classList.remove('hidden');
        var id = gid();
        if (id && window.NolanProgress && NolanProgress.recordResult) {
          var recorded = NolanProgress.recordResult(id, { score: score, total: TOTAL, skipXp: true });
          if (recorded) {
            document.dispatchEvent(new CustomEvent('nolan:progress', { detail: recorded }));
            if (recorded.medal === 'gold' && fun()) fun().confetti({ count: 20 });
          }
        }
      }

      function goNext() {
        if (canAnswer) return;
        roundIndex++;
        if (roundIndex >= TOTAL) showResults();
        else loadRound();
      }

      function startFresh() {
        clearCp();
        rounds = uniqueRounds(newSeed());
        roundIndex = 0;
        score = 0;
        streak = 0;
        finishScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        loadRound();
      }

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '←', '0', 'Clear'];
      keys.forEach(function (label) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn key' + (label === 'Clear' ? ' key-word' : '');
        btn.textContent = label;
        if (label === '←') btn.setAttribute('aria-label', 'Erase');
        if (label === 'Clear') btn.setAttribute('aria-label', 'Clear');
        btn.addEventListener('click', function () {
          if (label === '←') erase();
          else if (label === 'Clear') {
            if (!canAnswer) return;
            typed = '';
            paintAnswer('');
          } else typeDigit(label);
        });
        keypad.appendChild(btn);
      });

      checkBtn.addEventListener('click', submit);
      nextBtn.addEventListener('click', goNext);
      restartBtn.addEventListener('click', startFresh);
      hintBtn.addEventListener('click', function () {
        if (!canAnswer) return;
        var round = rounds[roundIndex];
        hintDisplay.textContent = 'Mr. Owl says: ' + round.hint;
        hintDisplay.classList.remove('hidden');
      });

      document.addEventListener('keydown', function (e) {
        if (!finishScreen.classList.contains('hidden')) return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key >= '0' && e.key <= '9') {
          typeDigit(e.key);
          e.preventDefault();
        } else if (e.key === 'Backspace') {
          erase();
          e.preventDefault();
        } else if (e.key === 'Enter') {
          if (canAnswer) submit();
          else goNext();
          e.preventDefault();
        }
      });

      (function restore() {
        var cp = null;
        if (window.NolanProgress && NolanProgress.loadCheckpoint) cp = NolanProgress.loadCheckpoint(gid());
        var saved = cp && cp.extra && Array.isArray(cp.extra.rounds) ? cp.extra.rounds : null;
        if (saved && saved.length === TOTAL && saved.every(roundOk)) {
          rounds = saved;
          roundIndex = Math.max(0, cp.index | 0);
          score = Math.max(0, Number(cp.score) || 0);
          streak = cp.extra && typeof cp.extra.streak === 'number' ? cp.extra.streak : 0;
          if (roundIndex > 0 && roundIndex < TOTAL && window.NolanProgress && NolanProgress.showResumeToast) {
            NolanProgress.showResumeToast('Resuming…');
          }
        } else {
          rounds = uniqueRounds(newSeed());
          roundIndex = 0;
          score = 0;
          streak = 0;
        }
        if (roundIndex >= TOTAL) showResults();
        else loadRound();
      })();
    })();
  </script>
</body>
</html>
