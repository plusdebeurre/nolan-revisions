<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Times Tables Match — Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    @media (min-width: 480px) {
      .memory-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .memory-card {
      aspect-ratio: 1;
      perspective: 600px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      font-family: inherit;
    }
    .memory-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .memory-card.flipped .memory-card-inner,
    .memory-card.matched .memory-card-inner {
      transform: rotateY(180deg);
    }
    .memory-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(1rem, 4vw, 1.35rem);
      border: 3px solid var(--card-border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    .memory-face.back {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: white;
      font-size: 1.75rem;
    }
    .memory-face.front {
      background: white;
      color: var(--hub-ink);
      transform: rotateY(180deg);
    }
    .memory-card.matched .memory-face.front {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .memory-card:disabled {
      cursor: default;
    }
  </style>
</head>
<body class="game theme-math" data-game-id="math/times-tables-match">
  <main class="w-full max-w-2xl mx-auto px-4 py-6">
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Math</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>

    <div id="play-screen">
      <header class="mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 drop-shadow-sm" style="color: var(--accent-dark)">Times Tables Match</h1>
        <p class="text-lg text-slate-500 font-medium">Flip two cards — match facts to answers!</p>
        <p id="match-counter" class="mt-3 text-sm font-semibold" style="color: var(--accent)">Pairs matched: 0 / 10</p>
        <p id="moves-counter" class="mt-1 text-sm text-slate-500 font-medium">Moves: 0</p>
      </header>

      <div class="question-card p-4 md:p-6 animate-pop">
        <div id="memory-grid" class="memory-grid"></div>
        <p id="status-msg" class="text-center mt-6 text-slate-600 font-medium min-h-[1.5rem]">Tap a card to start!</p>
      </div>
    </div>

    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4 animate-tada">🎉</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">You matched them all!</h2>
      <p class="text-2xl text-slate-600 mb-2">You scored <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="pair-total-label">12</span> pairs!</p>
      <p id="moves-display" class="text-lg text-slate-500 mb-2 font-medium"></p>
      <p id="moves-bonus" class="text-base text-green-600 font-semibold mb-8 hidden"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>

  <script src="../../../js/fun-effects.js"></script>
  <script>
    (function () {
      // Fixed pair bank — single-board memory game (all pairs shown together each round).
      // Focus: ×2, ×5, ×10; plus a few ×3 and ×4 facts for Grade 2.
      const PAIRS = [
        { id: 'a', text: '2 × 5' },
        { id: 'a', text: '10' },
        { id: 'b', text: '2 × 10' },
        { id: 'b', text: '20' },
        { id: 'c', text: '5 × 5' },
        { id: 'c', text: '25' },
        { id: 'd', text: '5 × 6' },
        { id: 'd', text: '30' },
        { id: 'e', text: '10 × 3' },
        { id: 'e', text: '30' },
        { id: 'f', text: '10 × 8' },
        { id: 'f', text: '80' },
        { id: 'g', text: '2 × 8' },
        { id: 'g', text: '16' },
        { id: 'h', text: '2 × 9' },
        { id: 'h', text: '18' },
        { id: 'i', text: '3 × 5' },
        { id: 'i', text: '15' },
        { id: 'j', text: '3 × 7' },
        { id: 'j', text: '21' },
        { id: 'k', text: '4 × 5' },
        { id: 'k', text: '20' },
        { id: 'l', text: '4 × 6' },
        { id: 'l', text: '24' }
      ];
      const TOTAL_PAIRS = new Set(PAIRS.map((p) => p.id)).size;

      const grid = document.getElementById('memory-grid');
      const matchCounter = document.getElementById('match-counter');
      const movesCounter = document.getElementById('moves-counter');
      const statusMsg = document.getElementById('status-msg');
      const playScreen = document.getElementById('play-screen');
      const resultScreen = document.getElementById('result-screen');
      const movesDisplay = document.getElementById('moves-display');
      const movesBonus = document.getElementById('moves-bonus');
      const scoreDisplay = document.getElementById('score-display');
      const pairTotalLabel = document.getElementById('pair-total-label');
      const restartBtn = document.getElementById('restart-btn');
      const PERFECT_MOVES = TOTAL_PAIRS;

      let cards = [];
      let flipped = [];
      let matchedCount = 0;
      let moves = 0;
      let lock = false;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildBoard() {
        grid.innerHTML = '';
        cards = shuffle(PAIRS.map((p, i) => ({ ...p, uid: i })));
        matchedCount = 0;
        moves = 0;
        flipped = [];
        lock = false;
        matchCounter.textContent = `Pairs matched: 0 / ${TOTAL_PAIRS}`;
        movesCounter.textContent = 'Moves: 0';
        statusMsg.textContent = 'Tap a card to start!';

        cards.forEach((card, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'memory-card';
          btn.dataset.index = String(index);
          btn.innerHTML = `
            <div class="memory-card-inner">
              <div class="memory-face back">✖️</div>
              <div class="memory-face front">${card.text}</div>
            </div>`;
          btn.addEventListener('click', () => flipCard(index));
          grid.appendChild(btn);
        });
      }

      function flipCard(index) {
        if (lock) return;
        const btn = grid.children[index];
        if (!btn || btn.classList.contains('flipped') || btn.classList.contains('matched')) return;

        btn.classList.add('flipped');
        flipped.push(index);

        if (flipped.length === 2) {
          moves++;
          movesCounter.textContent = `Moves: ${moves}`;
          lock = true;
          const [i0, i1] = flipped;
          const c0 = cards[i0];
          const c1 = cards[i1];
          const b0 = grid.children[i0];
          const b1 = grid.children[i1];

          if (c0.id === c1.id && c0.uid !== c1.uid) {
            matchedCount++;
            matchCounter.textContent = `Pairs matched: ${matchedCount} / ${TOTAL_PAIRS}`;
            statusMsg.textContent = 'Match! 🎉';
            b0.classList.add('matched');
            b1.classList.add('matched');
            flipped = [];
            lock = false;
            if (matchedCount === TOTAL_PAIRS) {
              setTimeout(showWin, 500);
            }
          } else {
            statusMsg.textContent = 'Not a match — try again!';
            setTimeout(() => {
              b0.classList.remove('flipped');
              b1.classList.remove('flipped');
              flipped = [];
              lock = false;
              statusMsg.textContent = 'Keep looking for pairs!';
            }, 900);
          }
        }
      }

      function showWin() {
        playScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        scoreDisplay.textContent = String(matchedCount);
        if (pairTotalLabel) pairTotalLabel.textContent = String(TOTAL_PAIRS);
        movesDisplay.textContent = `You used ${moves} moves to find all the pairs.`;
        if (moves <= PERFECT_MOVES) {
          movesBonus.textContent = 'Memory star bonus — very few moves!';
          movesBonus.classList.remove('hidden');
        } else {
          movesBonus.classList.add('hidden');
        }
        if (matchedCount === TOTAL_PAIRS && window.FunEffects) FunEffects.confetti();
      }

      restartBtn.addEventListener('click', () => {
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        buildBoard();
      });

      if (pairTotalLabel) pairTotalLabel.textContent = String(TOTAL_PAIRS);
      buildBoard();
    })();
  </script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
</body>
</html>
