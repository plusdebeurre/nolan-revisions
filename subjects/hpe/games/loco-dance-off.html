<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loco Dance-Off — HPE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .move-display { font-size: 3rem; line-height: 1.2; min-height: 4.5rem; }
    .loco-btn {
      min-height: 4.25rem;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 1.25rem;
      border: 4px solid #e2e8f0;
      transition: transform 0.15s, border-color 0.15s;
      cursor: pointer;
      font-family: inherit;
      padding: 1rem;
    }
    .loco-btn:active { transform: scale(0.98); }
    .loco-btn.loco { background: #ede9fe; border-color: #8b5cf6; color: #5b21b6; }
    .loco-btn.non { background: #e0f2fe; border-color: #0ea5e9; color: #0369a1; }
    .loco-btn.flash-correct { background: #dcfce7 !important; border-color: #22c55e !important; }
    .loco-btn.flash-wrong { background: #fee2e2 !important; border-color: #ef4444 !important; }
    .combo-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #fbbf24, #f97316);
      color: white;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.35);
    }
  </style>
</head>
<body class="game theme-hpe min-h-screen" data-game-id="hpe/loco-dance-off">
  <main class="w-full max-w-xl mx-auto px-4 py-6">
    <div class="score-hud" id="score-hud">Score: 0 / 18</div>
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← HPE</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>

    <div id="play-screen">
      <header class="mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 drop-shadow-sm" style="color: var(--accent-dark)">💃 Loco Dance-Off</h1>
        <p class="text-lg text-slate-500 font-medium">Locomotor or non-locomotor? Chain correct answers for combo points!</p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar-fill"></div></div>
        <p id="round-label" class="mt-2 text-sm font-semibold" style="color: var(--accent)">Round 1 of 18</p>
        <p class="mt-2">Combo: <span id="combo-display" class="combo-badge">×1</span></p>
      </header>

      <div id="game-card" class="question-card p-6 md:p-8 text-center animate-pop">
        <p class="text-slate-500 font-medium mb-2">This move is…</p>
        <div id="move-display" class="move-display font-bold text-slate-800 mb-6"></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button type="button" id="btn-loco" class="loco-btn loco">🚶 Locomotor</button>
          <button type="button" id="btn-non" class="loco-btn non">🧘 Non-locomotor</button>
        </div>
        <div id="round-feedback" class="hidden mt-6 p-4 rounded-xl text-lg font-medium"></div>
        <div class="text-center mt-4">
          <button type="button" id="next-round" class="hidden btn-primary">Next Move ⚡</button>
        </div>
      </div>
    </div>

    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">🎽</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Dance-Off Complete!</h2>
      <p class="text-2xl font-medium text-slate-600 mb-2">
        You scored <span id="final-score" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="max-points">18</span>!
      </p>
      <p id="best-combo" class="text-lg text-slate-500 mb-6 font-medium"></p>
      <p id="result-msg" class="text-lg text-slate-500 mb-8 font-medium"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>

  <script src="../../../js/fun-effects.js"></script>
  <script>
    (function () {
      const MOVES = [
        { word: 'Walk', emoji: '🚶', type: 'loco' },
        { word: 'Run', emoji: '🏃', type: 'loco' },
        { word: 'Jump', emoji: '⬆️', type: 'loco' },
        { word: 'Hop', emoji: '🐰', type: 'loco' },
        { word: 'Skip', emoji: '⏭️', type: 'loco' },
        { word: 'Slide', emoji: '🛝', type: 'loco' },
        { word: 'Leap', emoji: '🦘', type: 'loco' },
        { word: 'Crawl', emoji: '🤸', type: 'loco' },
        { word: 'Gallop', emoji: '🐴', type: 'loco' },
        { word: 'March', emoji: '🥁', type: 'loco' },
        { word: 'Stretch', emoji: '🙆', type: 'non' },
        { word: 'Bend', emoji: '🙇', type: 'non' },
        { word: 'Twist', emoji: '🌀', type: 'non' },
        { word: 'Sway', emoji: '💃', type: 'non' },
        { word: 'Push', emoji: '🤲', type: 'non' },
        { word: 'Pull', emoji: '🧲', type: 'non' },
        { word: 'Balance on one foot', emoji: '🦩', type: 'non' },
        { word: 'Wave arms', emoji: '👋', type: 'non' },
        { word: 'Turn in place', emoji: '🔄', type: 'non' },
        { word: 'Kick while standing still', emoji: '🦵', type: 'non' }
      ];

      const TOTAL = 18;
      let round = 0;
      let score = 0;
      let combo = 1;
      let bestCombo = 1;
      let canAnswer = true;
      let deck = [];
      let current = null;

      const moveDisplay = document.getElementById('move-display');
      const roundLabel = document.getElementById('round-label');
      const progressBar = document.getElementById('progress-bar');
      const comboDisplay = document.getElementById('combo-display');
      const scoreHud = document.getElementById('score-hud');
      const roundFeedback = document.getElementById('round-feedback');
      const nextRound = document.getElementById('next-round');
      const btnLoco = document.getElementById('btn-loco');
      const btnNon = document.getElementById('btn-non');
      const gameCard = document.getElementById('game-card');
      const playScreen = document.getElementById('play-screen');
      const resultScreen = document.getElementById('result-screen');

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function updateHud() {
        scoreHud.textContent = 'Score: ' + score + ' / ' + TOTAL;
        if (window.FunEffects) FunEffects.pulseScore(scoreHud);
      }

      function updateComboUI() {
        comboDisplay.textContent = '×' + combo;
        if (combo >= 3) comboDisplay.classList.add('animate-tada');
        else comboDisplay.classList.remove('animate-tada');
      }

      function startGame() {
        round = 0;
        score = 0;
        combo = 1;
        bestCombo = 1;
        deck = shuffle(MOVES).slice(0, TOTAL);
        playScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        updateHud();
        updateComboUI();
        loadRound();
      }

      function loadRound() {
        canAnswer = true;
        current = deck[round];
        moveDisplay.innerHTML = '<span class="block">' + current.emoji + '</span><span class="text-3xl">' + current.word + '</span>';
        roundLabel.textContent = 'Round ' + (round + 1) + ' of ' + TOTAL;
        progressBar.style.width = ((round / TOTAL) * 100) + '%';
        roundFeedback.classList.add('hidden');
        nextRound.classList.add('hidden');
        btnLoco.classList.remove('flash-correct', 'flash-wrong');
        btnNon.classList.remove('flash-correct', 'flash-wrong');
        btnLoco.disabled = false;
        btnNon.disabled = false;
      }

      function answer(picked) {
        if (!canAnswer) return;
        canAnswer = false;
        const correct = picked === current.type;
        const correctBtn = current.type === 'loco' ? btnLoco : btnNon;
        const wrongBtn = current.type === 'loco' ? btnNon : btnLoco;
        correctBtn.classList.add('flash-correct');
        if (!correct) wrongBtn.classList.add('flash-wrong');

        const label = current.type === 'loco' ? 'Locomotor' : 'Non-locomotor';
        roundFeedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');

        if (correct) {
          score++;
          combo = Math.min(combo + 1, 5);
          if (combo > bestCombo) bestCombo = combo;
          const bonus = combo >= 3 ? ' Combo ×' + combo + '!' : '';
          roundFeedback.classList.add('bg-green-100', 'text-green-800');
          roundFeedback.innerHTML = '<strong>Yes! 🎉</strong> ' + current.word + ' is ' + label + '.' + bonus;
          updateHud();
          updateComboUI();
          if (window.FunEffects) {
            FunEffects.showStreak(combo);
            if (combo >= 3) FunEffects.confetti({ count: 14 });
          }
        } else {
          combo = 1;
          updateComboUI();
          if (window.FunEffects) FunEffects.shake(gameCard);
          roundFeedback.classList.add('bg-red-100', 'text-red-800');
          roundFeedback.innerHTML = '<strong>Not quite!</strong> ' + current.word + ' is ' + label + '. Combo reset to ×1.';
        }
        nextRound.classList.remove('hidden');
      }

      btnLoco.addEventListener('click', () => answer('loco'));
      btnNon.addEventListener('click', () => answer('non'));

      nextRound.addEventListener('click', () => {
        round++;
        if (round < TOTAL) loadRound();
        else showResults();
      });

      function showResults() {
        progressBar.style.width = '100%';
        playScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        document.getElementById('final-score').textContent = String(score);
        document.getElementById('max-points').textContent = String(TOTAL);
        document.getElementById('best-combo').textContent = 'Best combo streak: ×' + bestCombo;
        const msg = document.getElementById('result-msg');
        if (score === TOTAL) {
          msg.textContent = 'Perfect moves! You are a locomotor legend! 🌟';
          if (window.FunEffects) FunEffects.celebratePerfect();
        } else if (score >= Math.floor(TOTAL * 0.75)) {
          msg.textContent = 'Awesome dance-off! Keep the combo going! 👍';
        } else {
          msg.textContent = 'Locomotor = travel through space. Non-locomotor = stay in place! 💪';
        }
      }

      document.getElementById('restart-btn').addEventListener('click', startGame);
      startGame();
    })();
  </script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
</body>
</html>
