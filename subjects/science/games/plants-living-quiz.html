        {
          question: 'Which of these is NOT a living thing?',
          options: ['A bird', 'A rock', 'A tree', 'A cat'],

          options: ['Ice cream', 'Sunlight', 'An umbrella', 'Music'],
          correctAnswer: 1,

        {

        {

          options: ['Breathe', 'Move', 'Reproduce', 'Eat'],
          correctAnswer: 2,
          explanation: 'Reproduction allows living things to create a new generation.'
        },
        {
          question: 'Where do plants make their food?',
          options: ['In the roots', 'In the leaves', 'In the stores', 'In the rocks'],
          correctAnswer: 1,
          explanation: 'Food is created in the leaves with the help of sunlight.'
        },
        {
          question: 'Which one is a living thing?',
          options: ['A scooter', 'A cloud', 'A coconut tree', 'A balloon'],
          correctAnswer: 2,
          explanation: 'A coconut tree is a plant; it grows and needs water and light.'
        },
        {
          question: 'What do we call the part that protects the seeds?',
          options: ['The root', 'The fruit', 'The stem', 'The leaf'],
          correctAnswer: 1,
