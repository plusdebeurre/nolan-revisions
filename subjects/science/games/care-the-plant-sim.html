<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care the Plant Sim — Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .health-bar { height: 1.25rem; border-radius: 9999px; background: #e2e8f0; overflow: hidden; }
    .health-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #84cc16); transition: width 0.4s ease; }
  </style>
</head>
<body class="game theme-science" data-game-id="science/care-the-plant-sim">
  <main class="w-full max-w-2xl mx-auto px-4 py-6">
    <div class="score-hud" id="score-hud">Score: 0 / 10</div>
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Science</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>
    <div id="play-screen">
      <header class="mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2" style="color: var(--accent-dark)">🪴 Care the Plant Sim</h1>
        <p class="text-lg text-slate-500 font-medium">Pick the best care — keep plant health high!</p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar-fill"></div></div>
        <p id="round-label" class="mt-2 text-sm font-semibold" style="color: var(--accent)">Day 1 of 10</p>
      </header>
      <div class="question-card p-6 md:p-8 animate-pop">
        <div class="flex items-center justify-between gap-4 mb-4">
          <span id="plant-mood" class="text-5xl">🌱</span>
          <div class="flex-1">
            <p class="text-sm font-semibold text-slate-600 mb-1">Plant health</p>
            <div class="health-bar"><div id="health-fill" class="health-fill" style="width: 70%"></div></div>
            <p id="health-text" class="text-xs text-slate-500 mt-1">70% — okay</p>
          </div>
        </div>
        <p id="scenario" class="text-xl font-semibold text-center text-slate-700 mb-6"></p>
        <div id="choices" class="grid grid-cols-1 gap-3 mb-4"></div>
        <div id="feedback" class="hidden text-center p-4 rounded-xl text-lg font-medium mb-4"></div>
        <div class="text-center"><button type="button" id="next-btn" class="hidden btn-primary">Next Day 🌤️</button></div>
      </div>
    </div>
    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">🌻</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Growing Season Done!</h2>
      <p class="text-2xl font-medium text-slate-600 mb-2">Care score: <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of 10!</p>
      <p id="final-health" class="text-lg text-green-700 font-semibold mb-6"></p>
      <p id="result-message" class="text-lg text-slate-500 mb-8 font-medium"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>
  <script src="../../../js/fun-effects.js"></script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
  <script>
    (function () {
      const ROUNDS = [
        {
          scenario: '☀️ Sunny morning. The soil feels dry on top. What first?',
          correct: 1,
          options: ['Pour soda on leaves', 'Water the soil gently', 'Put plant in the freezer', 'Ignore it for a week'],
          delta: 15,
          bad: -12,
          explain: 'Plants need water when soil is dry.'
        },
        {
          scenario: '🏠 Plant lives in a dark hallway. Leaves look pale.',
          correct: 0,
          options: ['Move pot near a sunny window', 'Paint leaves green', 'Give it candy', 'Turn off all lights forever'],
          delta: 15,
          bad: -15,
          explain: 'Sunlight helps leaves make food.'
        },
        {
          scenario: '🪴 Roots poke out of tiny pot holes. Stem looks crowded.',
          correct: 2,
          options: ['Squeeze into smaller cup', 'Cut all roots off', 'Repot in a bigger pot with soil', 'Hang upside down'],
          delta: 14,
          bad: -10,
          explain: 'Plants need space for roots to grow.'
        },
        {
          scenario: '🌬️ Plant is in a sealed plastic bag all day. Air feels stuffy.',
          correct: 1,
          options: ['Seal bag tighter', 'Open window — fresh air', 'Wrap in foil', 'Hide under pillow'],
          delta: 12,
          bad: -12,
          explain: 'Plants need air (including CO₂).'
        },
        {
          scenario: '🥀 Hot week — you forgot to water. Leaves droop.',
          correct: 3,
          options: ['Add ice cubes only', 'Spray with glue', 'Give energy drink', 'Water soil until moist, not muddy'],
          delta: 15,
          bad: -8,
          explain: 'A good drink helps wilted plants recover.'
        },
        {
          scenario: '🌱 Seed tray has no dirt — seeds sit on plastic.',
          correct: 0,
          options: ['Add soil so roots have a home', 'Leave seeds on plastic', 'Cover with stickers', 'Feed seeds popcorn'],
          delta: 14,
          bad: -14,
          explain: 'Seeds germinate in soil with nutrients.'
        },
        {
          scenario: '❄️ Winter night: frost outside. Tender plant is on the porch.',
          correct: 2,
          options: ['Leave outside to freeze', 'Pour hot oil on it', 'Bring plant indoors to warmth & light', 'Bury in snow for fun'],
          delta: 13,
          bad: -20,
          explain: 'Most garden plants cannot survive hard frost.'
        },
        {
          scenario: '🐛 Chewed holes in leaves, but soil is fine and sunny.',
          correct: 1,
          options: ['Stop all watering forever', 'Ask a grown-up about safe bug help', 'Put plant in closet', 'Feed leaves soap bubbles'],
          delta: 10,
          bad: -5,
          explain: 'Healthy care includes protecting from pests.'
        },
        {
          scenario: '🌞 Summer — soil moist, but plant in deep shade under bed.',
          correct: 0,
          options: ['Move to bright indirect sunlight', 'Add more shade', 'Water with juice only', 'Remove all leaves'],
          delta: 15,
          bad: -15,
          explain: 'Light + water work together.'
        },
        {
          scenario: '🎉 Last day! Plant looks good. Best routine?',
          correct: 3,
          options: ['Water once a year only', 'Never let air near it', 'Keep in dark wet closet', 'Steady water, light, space & air'],
          delta: 12,
          bad: -10,
          explain: 'Plants need all four: water, light, space, air.'
        }
      ];
      const TOTAL = ROUNDS.length;
      let roundIndex = 0, score = 0, streak = 0, health = 70, canAnswer = true;
      /* nolan-cp */
      function __nolanSaveCp() {
        if (!window.NolanProgress) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        NolanProgress.saveCheckpoint(id, { index: roundIndex, score: score });
      }
      function __nolanClearCp() {
        if (!window.NolanProgress) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        NolanProgress.clearCheckpoint(id);
      }
      (function __nolanRestoreCp() {
        if (!window.NolanProgress || !NolanProgress.loadCheckpoint) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        var cp = NolanProgress.loadCheckpoint(id);
        if (!cp) return;
        roundIndex = Math.max(0, cp.index | 0);
        score = Math.max(0, Number(cp.score) || 0);
        if (NolanProgress.showResumeToast) NolanProgress.showResumeToast('Resuming…');
      })();


      const scoreHud = document.getElementById('score-hud');
      const healthFill = document.getElementById('health-fill');
      const healthText = document.getElementById('health-text');
      const plantMood = document.getElementById('plant-mood');
      const choicesEl = document.getElementById('choices');
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('next-btn');
      const playScreen = document.getElementById('play-screen');
      const resultScreen = document.getElementById('result-screen');

      function updateHud() {
        scoreHud.textContent = 'Score: ' + score + ' / ' + TOTAL;
        FunEffects.pulseScore(scoreHud);
      }

      function moodEmoji() {
        if (health >= 85) return '🌻';
        if (health >= 60) return '🌿';
        if (health >= 40) return '🥀';
        return '🍂';
      }

      function renderHealth() {
        health = Math.max(0, Math.min(100, health));
        healthFill.style.width = health + '%';
        healthText.textContent = health + '% — ' + (health >= 75 ? 'happy' : health >= 45 ? 'okay' : 'struggling');
        plantMood.textContent = moodEmoji();
      }

      function showRound() {
        canAnswer = true;
        feedback.classList.add('hidden');
        nextBtn.classList.add('hidden');
        const r = ROUNDS[roundIndex];
        document.getElementById('scenario').textContent = r.scenario;
        document.getElementById('round-label').textContent = 'Day ' + (roundIndex + 1) + ' of ' + TOTAL;
        document.getElementById('progress-bar').style.width = (roundIndex / TOTAL * 100) + '%';
        choicesEl.innerHTML = '';
        r.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'question-card p-4 text-left font-semibold text-slate-700 hover:bg-green-50';
          btn.textContent = opt;
          btn.addEventListener('click', () => onChoice(btn, i, r));
          choicesEl.appendChild(btn);
        });
        renderHealth();
      }

      function onChoice(btn, idx, r) {
        if (!canAnswer) return;
        canAnswer = false;
        const good = idx === r.correct;
        if (good) {
          score++;
          streak++;
          health += r.delta;
          FunEffects.showStreak(streak);
          FunEffects.confetti({ count: 10 });
          feedback.className = 'text-center p-4 rounded-xl text-lg font-medium mb-4 bg-green-50 text-green-800 border-2 border-green-200';
          feedback.textContent = 'Great care! ' + r.explain;
        } else {
          streak = 0;
          health += r.bad;
          FunEffects.shake(btn);
          feedback.className = 'text-center p-4 rounded-xl text-lg font-medium mb-4 bg-amber-50 text-amber-900 border-2 border-amber-200';
          feedback.textContent = 'That hurts the plant. ' + r.explain;
        }
        renderHealth();
        feedback.classList.remove('hidden');
        updateHud();
        nextBtn.classList.remove('hidden');
      }

      nextBtn.addEventListener('click', () => {
        roundIndex++; __nolanSaveCp();
        if (roundIndex >= TOTAL) {
          playScreen.classList.add('hidden');
          resultScreen.classList.remove('hidden');
          document.getElementById('score-display').textContent = String(score);
          document.getElementById('final-health').textContent = 'Final plant health: ' + health + '% ' + moodEmoji();
          const msg = document.getElementById('result-message');
          if (score === TOTAL && health >= 80) {
            msg.textContent = 'Master gardener! Perfect choices! 🌟';
            FunEffects.celebratePerfect();
          } else if (score >= TOTAL * 0.7) {
            msg.textContent = 'Your plant would thrive with you! 👍';
          } else {
            msg.textContent = 'Think water, light, space, and air each day! 💪';
          }
          return;
        }
        showRound();
      });

      document.getElementById('restart-btn').addEventListener('click', () => {
        __nolanClearCp(); roundIndex = 0;
        score = 0;
        streak = 0;
        health = 70;
        updateHud();
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        showRound();
      });

      updateHud();
      showRound();
    })();
  </script>
</body>
</html>
