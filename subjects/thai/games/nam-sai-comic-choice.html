<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nam Sai Comic Choice — Thai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .comic-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .comic-panel {
      border: 4px solid #1e293b;
      border-radius: 0.5rem;
      background: #fffbeb;
      padding: 0.75rem;
      min-height: 7rem;
      box-shadow: 4px 4px 0 #1e293b;
    }
    .comic-panel.active-scene {
      grid-column: 1 / -1;
      min-height: 8rem;
      background: linear-gradient(180deg, #e0f2fe, #fffbeb);
    }
    .panel-emoji { font-size: 2.5rem; line-height: 1; }
    .panel-caption {
      font-family: 'Sarabun', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0.5rem;
      line-height: 1.35;
    }
    .story-pick {
      text-align: left;
      padding: 1rem 1.1rem;
      min-height: 4.5rem;
      font-size: 1.05rem;
      line-height: 1.35;
    }
    .story-pick .thai-bit {
      font-family: 'Sarabun', sans-serif;
      font-weight: 700;
    }
    .points-badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
  </style>
</head>
<body class="game theme-thai" data-game-id="thai/nam-sai-comic-choice">
  <main class="w-full max-w-2xl mx-auto px-4 py-6">
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Thai</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>
    <div id="play-screen">
      <header class="mb-4 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2" style="color: var(--accent-dark)">📖 Nam Sai Comic Choice</h1>
        <p class="text-lg text-slate-500">Read the panels — pick what really happened!</p>
        <p id="score-hud" class="mt-2 text-sm font-semibold" style="color: var(--accent)">Points: 0 · Scene 1 of 10</p>
        <div class="progress-track max-w-md mx-auto mt-3"><div id="progress-bar" class="progress-bar-fill"></div></div>
      </header>
      <div class="question-card p-5 md:p-7 animate-pop">
        <div id="comic-strip" class="comic-strip"></div>
        <p id="scene-question" class="font-bold text-slate-700 mb-3 text-center"></p>
        <div id="story-choices" class="grid gap-3"></div>
        <div id="feedback" class="hidden mt-4 p-4 rounded-xl text-lg font-medium"></div>
        <button type="button" id="next-btn" class="hidden btn-primary w-full mt-4">Next scene ➡</button>
      </div>
    </div>
    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">🧊</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Story hero!</h2>
      <p class="text-2xl text-slate-600 mb-6">You scored <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="total-display">10</span> points!</p>
      <p id="result-message" class="text-lg text-slate-500 mb-8"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>
  <script src="../../../js/fun-effects.js"></script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
  <script>
    const SCENES = [
      {
        emoji: '🐘🐘', caption: 'Two baby elephants walk in the sun.',
        question: 'Who are the baby elephants in Nam Sai?',
        choices: [
          { text: 'Bai Bok & Bai Bua', correct: true, pts: 1 },
          { text: 'Som & Nok', correct: false, pts: 0 }
        ],
        tip: 'Bai Bok and Bai Bua are the stars of the chapter!'
      },
      {
        emoji: '🧊🍯', caption: 'A cold sweet treat in a cup.',
        question: 'What snack do they love?',
        choices: [
          { text: '<span class="thai-bit">น้ำแข็งกด</span> — crushed ice + syrup', correct: true, pts: 1 },
          { text: 'Hot noodle soup', correct: false, pts: 0 }
        ],
        tip: 'น้ำแข็งกด is pressed crushed ice with sweet syrup.'
      },
      {
        emoji: '❄️💧', caption: 'Ice words in Thai class.',
        question: 'What does <span class="thai-bit">น้ำแข็ง</span> mean?',
        choices: [
          { text: 'Ice', correct: true, pts: 1 },
          { text: 'Banana leaf', correct: false, pts: 0 }
        ],
        tip: 'น้ำ = water, แข็ง = hard → ice!'
      },
      {
        emoji: '📚🇹🇭', caption: 'Open the Thai reader.',
        question: 'Nam Sai is…',
        choices: [
          { text: 'The story chapter Nolan studies', correct: true, pts: 1 },
          { text: 'A math times table', correct: false, pts: 0 }
        ],
        tip: 'Nam Sai is story vocabulary from Thai class.'
      },
      {
        emoji: '🐘✨', caption: 'Bai Bok gets an idea.',
        question: 'Bai Bok and Bai Bua are…',
        choices: [
          { text: 'Baby elephants', correct: true, pts: 1 },
          { text: 'Two birds', correct: false, pts: 0 }
        ],
        tip: 'Remember: chang = elephant — ช้าง!'
      },
      {
        emoji: '🥤🧊', caption: 'Syrup drips on the ice.',
        question: 'น้ำแข็งกด is best described as…',
        choices: [
          { text: 'Crushed ice with syrup', correct: true, pts: 1 },
          { text: 'Grilled fish', correct: false, pts: 0 }
        ],
        tip: 'กด = press — ice is pressed with flavour.'
      },
      {
        emoji: '๑🍧', caption: 'Count one treat.',
        question: 'One cup — which Thai digit?',
        choices: [
          { text: '<span class="thai-bit">๑</span>', correct: true, pts: 1 },
          { text: '<span class="thai-bit">๕</span>', correct: false, pts: 0 }
        ],
        tip: '๑ = 1 (nueng).'
      },
      {
        emoji: '๒🍧🍧', caption: 'Two cups for friends.',
        question: 'Two treats — tap the right digit.',
        choices: [
          { text: '<span class="thai-bit">๒</span>', correct: true, pts: 1 },
          { text: '<span class="thai-bit">๗</span>', correct: false, pts: 0 }
        ],
        tip: '๒ = 2 (song).'
      },
      {
        emoji: '🌴☀️', caption: 'Hot day, cold snack.',
        question: 'Why is the ice treat perfect?',
        choices: [
          { text: 'It is cold and sweet on a hot day', correct: true, pts: 1 },
          { text: 'It replaces alphabet class', correct: false, pts: 0 }
        ],
        tip: 'Story words help you talk about what happens in the book.'
      },
      {
        emoji: '🎉🐘', caption: 'Happy ending at Nam Sai.',
        question: 'Learning story vocab helps you…',
        choices: [
          { text: 'Read and retell the chapter', correct: true, pts: 1 },
          { text: 'Skip tone marks forever', correct: false, pts: 0 }
        ],
        tip: 'Story + Trai Yang work together in Grade 2 Thai!'
      }
    ];
    let i = 0, score = 0, streak = 0, locked = false;
      /* nolan-cp */
      function __nolanSaveCp() {
        if (!window.NolanProgress) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        NolanProgress.saveCheckpoint(id, { index: i, score: score });
      }
      function __nolanClearCp() {
        if (!window.NolanProgress) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        NolanProgress.clearCheckpoint(id);
      }
      (function __nolanRestoreCp() {
        if (!window.NolanProgress || !NolanProgress.loadCheckpoint) return;
        var id = NolanProgress.inferGameIdFromPath() || (document.body && document.body.getAttribute('data-game-id'));
        if (!id) return;
        var cp = NolanProgress.loadCheckpoint(id);
        if (!cp) return;
        i = Math.max(0, cp.index | 0);
        score = Math.max(0, Number(cp.score) || 0);
        if (NolanProgress.showResumeToast) NolanProgress.showResumeToast('Resuming…');
      })();

    const comicStrip = document.getElementById('comic-strip');
    const sceneQuestion = document.getElementById('scene-question');
    const storyChoices = document.getElementById('story-choices');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const scoreHud = document.getElementById('score-hud');

    function load() {
      locked = false;
      feedback.classList.add('hidden');
      nextBtn.classList.add('hidden');
      const s = SCENES[i];
      comicStrip.innerHTML = `
        <div class="comic-panel active-scene text-center">
          <div class="panel-emoji">${s.emoji}</div>
          <p class="panel-caption">${s.caption}</p>
        </div>
        <div class="comic-panel text-center opacity-60">
          <div class="panel-emoji">💬</div>
          <p class="panel-caption">What do YOU think?</p>
        </div>`;
      sceneQuestion.innerHTML = s.question;
      progressBar.style.width = `${(i / SCENES.length) * 100}%`;
      scoreHud.textContent = `Points: ${score} · Scene ${i + 1} of ${SCENES.length}`;
      storyChoices.innerHTML = '';
      s.choices.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn story-pick w-full';
        btn.innerHTML = c.text;
        btn.addEventListener('click', () => pick(idx, s));
        storyChoices.appendChild(btn);
      });
    }
    function pick(idx, s) {
      if (locked) return;
      locked = true;
      const choice = s.choices[idx];
      [...storyChoices.children].forEach((b, j) => {
        if (s.choices[j].correct) b.classList.add('correct');
        else if (j === idx) b.classList.add('wrong');
      });
      feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
      if (choice.correct) {
        score += choice.pts;
        streak++;
        if (window.FunEffects) {
          FunEffects.showStreak(streak);
          FunEffects.pulseScore(scoreHud);
        }
        feedback.classList.add('bg-green-100', 'text-green-800');
        feedback.innerHTML = `<strong>+<span class="points-badge">${choice.pts} pt</span> 🎉</strong><br>${s.tip}`;
      } else {
        streak = 0;
        if (window.FunEffects) FunEffects.shake(comicStrip);
        feedback.classList.add('bg-red-100', 'text-red-800');
        feedback.innerHTML = `<strong>Check the comic!</strong><br>${s.tip}`;
      }
      scoreHud.textContent = `Points: ${score} · Scene ${i + 1} of ${SCENES.length}`;
      nextBtn.classList.remove('hidden');
    }
    nextBtn.addEventListener('click', () => {
      i++; __nolanSaveCp();
      if (i < SCENES.length) load();
      else {
        progressBar.style.width = '100%';
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('score-display').textContent = score;
        document.getElementById('total-display').textContent = SCENES.length;
        document.getElementById('result-message').textContent =
          score === SCENES.length ? 'Nam Sai expert! 🌟' : score >= 8 ? 'Great story memory! 👍' : 'Reread the chapter, then replay! 💪';
        if (score === SCENES.length && window.FunEffects) FunEffects.confetti();
      }
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
      __nolanClearCp(); i = 0; score = 0; streak = 0;
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('play-screen').classList.remove('hidden');
      load();
    });
    load();
  </script>
</body>
</html>
