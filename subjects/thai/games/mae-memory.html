<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mae Memory — Thai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/shared.css">
  <style>
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }
    @media (min-width: 480px) {
      .memory-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .memory-card {
      aspect-ratio: 1;
      perspective: 600px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      font-family: inherit;
    }
    .memory-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .memory-card.flipped .memory-card-inner,
    .memory-card.matched .memory-card-inner {
      transform: rotateY(180deg);
    }
    .memory-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(0.85rem, 3.2vw, 1.05rem);
      text-align: center;
      padding: 0.35rem;
      line-height: 1.2;
      border: 3px solid var(--card-border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    .memory-face.back {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: white;
      font-size: 1.5rem;
      font-family: 'Fredoka', sans-serif;
    }
    .memory-face.front {
      background: white;
      color: var(--hub-ink);
      transform: rotateY(180deg);
      font-family: 'Sarabun', sans-serif;
    }
    .memory-card.matched .memory-face.front {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .memory-card:disabled { cursor: default; }
  </style>
</head>
<body class="game theme-thai" data-game-id="thai/mae-memory">
  <main class="w-full max-w-2xl mx-auto px-4 py-6">
    <div class="nav-bar">
      <a class="nav-link" href="../index.html">← Thai</a>
      <a class="nav-link" href="../../../index.html">🏠 Home</a>
    </div>
    <div id="play-screen">
      <header class="mb-6 text-center animate-pop">
        <h1 class="text-3xl md:text-4xl font-bold mb-2" style="color: var(--accent-dark)">🐘 Mae Memory</h1>
        <p class="text-lg text-slate-500">Match each word to its Mae ending family!</p>
        <p id="score-hud" class="mt-3 text-sm font-semibold" style="color: var(--accent)">Score: 0 / 8 pairs</p>
        <p id="moves-counter" class="mt-1 text-sm text-slate-500 font-medium">Moves: 0</p>
      </header>
      <div class="question-card p-4 md:p-6 animate-pop">
        <div id="memory-grid" class="memory-grid"></div>
        <p id="status-msg" class="text-center mt-6 text-slate-600 font-medium min-h-[1.5rem]">Flip a word and its Mae family!</p>
      </div>
    </div>
    <div id="result-screen" class="hidden question-card p-8 text-center animate-pop">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-4xl font-bold mb-4" style="color: var(--accent-dark)">Mae match master!</h2>
      <p class="text-2xl text-slate-600 mb-2">You scored <span id="score-display" class="font-bold text-3xl" style="color: var(--accent)">0</span> out of <span id="pair-total-label">8</span>!</p>
      <p id="moves-display" class="text-lg text-slate-500 mb-8 font-medium"></p>
      <button type="button" id="restart-btn" class="btn-primary">Play Again 🔄</button>
    </div>
  </main>
  <script src="../../../js/fun-effects.js"></script>
  <script src="../../../js/progress.js"></script>
  <script src="../../../js/shell.js"></script>
  <script>
    (function () {
      const PAIRS = [
        { id: 'a', text: 'ช้าง' },
        { id: 'a', text: 'แม่กง' },
        { id: 'b', text: 'บ้าน' },
        { id: 'b', text: 'แม่กน' },
        { id: 'c', text: 'ส้ม' },
        { id: 'c', text: 'แม่กม' },
        { id: 'd', text: 'นก' },
        { id: 'd', text: 'แม่กก' },
        { id: 'e', text: 'เป็ด' },
        { id: 'e', text: 'แม่กด' },
        { id: 'f', text: 'กบ' },
        { id: 'f', text: 'แม่กบ' },
        { id: 'g', text: 'แมว' },
        { id: 'g', text: 'แม่เกอว' },
        { id: 'h', text: 'ยาย' },
        { id: 'h', text: 'แม่เกย' }
      ];
      const TOTAL_PAIRS = 8;
      const grid = document.getElementById('memory-grid');
      const scoreHud = document.getElementById('score-hud');
      const movesCounter = document.getElementById('moves-counter');
      const statusMsg = document.getElementById('status-msg');
      const playScreen = document.getElementById('play-screen');
      const resultScreen = document.getElementById('result-screen');
      const scoreDisplay = document.getElementById('score-display');
      const movesDisplay = document.getElementById('moves-display');
      const restartBtn = document.getElementById('restart-btn');

      let cards = [];
      let flipped = [];
      let matchedCount = 0;
      let moves = 0;
      let lock = false;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function updateHud() {
        scoreHud.textContent = `Score: ${matchedCount} / ${TOTAL_PAIRS} pairs`;
      }
      function buildBoard() {
        grid.innerHTML = '';
        cards = shuffle(PAIRS.map((p, i) => ({ ...p, uid: i })));
        matchedCount = 0;
        moves = 0;
        flipped = [];
        lock = false;
        updateHud();
        movesCounter.textContent = 'Moves: 0';
        statusMsg.textContent = 'Flip a word and its Mae family!';

        cards.forEach((card, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'memory-card';
          btn.innerHTML = `
            <div class="memory-card-inner">
              <div class="memory-face back">🐘</div>
              <div class="memory-face front">${card.text}</div>
            </div>`;
          btn.addEventListener('click', () => flipCard(index));
          grid.appendChild(btn);
        });
      }
      function flipCard(index) {
        if (lock) return;
        const btn = grid.children[index];
        if (!btn || btn.classList.contains('flipped') || btn.classList.contains('matched')) return;
        btn.classList.add('flipped');
        flipped.push(index);
        if (flipped.length === 2) {
          moves++;
          movesCounter.textContent = `Moves: ${moves}`;
          lock = true;
          const [i0, i1] = flipped;
          const c0 = cards[i0];
          const c1 = cards[i1];
          const b0 = grid.children[i0];
          const b1 = grid.children[i1];
          if (c0.id === c1.id && c0.uid !== c1.uid) {
            matchedCount++;
            updateHud();
            if (window.FunEffects) FunEffects.pulseScore(scoreHud);
            statusMsg.textContent = 'Mae match! 🎉';
            b0.classList.add('matched');
            b1.classList.add('matched');
            flipped = [];
            lock = false;
            if (matchedCount === TOTAL_PAIRS) setTimeout(showWin, 500);
          } else {
            statusMsg.textContent = 'Different families — try again!';
            if (window.FunEffects) FunEffects.shake(b1);
            setTimeout(() => {
              b0.classList.remove('flipped');
              b1.classList.remove('flipped');
              flipped = [];
              lock = false;
            }, 900);
          }
        }
      }
      function showWin() {
        playScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        scoreDisplay.textContent = String(matchedCount);
        movesDisplay.textContent = `You found all pairs in ${moves} moves.`;
        if (matchedCount === TOTAL_PAIRS && window.FunEffects) FunEffects.confetti();
      }
      restartBtn.addEventListener('click', () => {
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        buildBoard();
      });
      buildBoard();
    })();
  </script>
</body>
</html>
