[build]
  publish = "."
  command = "echo 'No build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SAMEORIGIN so app.html can keep fullscreen while navigating inside #nolan-stage
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/play"
  to = "/app.html"
  status = 302
